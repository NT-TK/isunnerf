// ※ ForgeGradleの版などは、お手元で動いている他のForge 1.20.1プロジェクトと同じ版に合わせてください
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = 'dev.ironsunnerf'
base { archivesName = "${mod_id}-mc${minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Mixin の注釈(コンパイル時のみ。実行時は Forge 本体に含まれる)
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // libs/ に Iron's Spells 1.20.1-3.16.3 のjarと、そのコンパイルに必要な依存jarを入れてください
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.named('processResources', ProcessResources).configure {
    var props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}

tasks.named('jar', Jar).configure {
    // Forge 1.20.1 は、この属性で指定されたMixin設定を読み込む
    manifest.attributes(['MixinConfigs': 'irons_unnerf.mixins.json'])
    finalizedBy 'reobfJar'
}

// libs/ に Iron's Spells のjarがない場合は、大量のコンパイルエラーの代わりに分かりやすいメッセージで止める
tasks.named('compileJava') {
    doFirst {
        if (fileTree(dir: 'libs', include: '*irons_spellbooks*.jar').isEmpty()) {
            throw new GradleException("libs/ に Iron's Spells 'n Spellbooks のjar(irons_spellbooks-*.jar)がありません。" +
                    " mods フォルダから libs/ にコピーしてください(依存MODのjarも一緒に)。")
        }
    }
}
