// ※ プラグイン版はお手元の他のNeoForge 1.21.1 MODプロジェクトと同じ版に合わせてください
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = 'dev.ironsunnerf'
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArguments.addAll '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    // libs/ に Iron's Spells 1.21.1-3.16.3 のjarと、そのコンパイルに必要な依存jar
    // (Iron's Lib, GeckoLib, Curios, PlayerAnimator など) を入れてください
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    // 動作確認用(runClient)に使う場合は次の行を有効化
    // localRuntime fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(ProcessResources).configureEach {
    var props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
